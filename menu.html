<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://benjaminlouis.eu/style.css">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MENU - Benjamin Louis</title>
    <script>
        let currentLang = 'fr';

        function toggleLanguage() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            const langBtn = document.getElementById('lang-btn');

            if (langBtn) {
                langBtn.textContent = currentLang === 'fr' ? '🇬🇧 EN' : '🇫🇷 FR';
            }

            // Met à jour tous les éléments contenant data-fr et data-en
            document.querySelectorAll('[data-fr][data-en]').forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });

            // Gestion spécifique pour la valeur du bouton d'envoi du formulaire
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.value = currentLang === 'fr' ? 'ENVOYER' : 'SEND';
            }
        }
    </script>
</head>

<body class="body-menu">

    <div class="wrapperMenu">

        <nav id="menu-full">
            <a href="https://benjaminlouis.eu/index.html" class="menu-link" data-fr="Accueil" data-en="Home">Accueil</a>
            <a href="https://benjaminlouis.eu/a-propos.html" class="menu-link" data-fr="À propos" data-en="About">À
                propos</a>
            <a href="https://benjaminlouis.eu/portfolio.html" class="menu-link" data-fr="Portfolio"
                data-en="Portfolio">Portfolio</a>
            <a href="https://benjaminlouis.eu/mentions.html" class="menu-link" data-fr="Mentions légales"
                data-en="Legal notices">Mentions légales</a><br>
            <div class="lang-switch">
                <button id="lang-btn" onclick="toggleLanguage()">🇬🇧 EN</button>
            </div>
        </nav>
    </div>
</body>

</html>
