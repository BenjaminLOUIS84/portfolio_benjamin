<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.html">
    <link rel="stylesheet" href="portfolio.html">
    <link rel="stylesheet" href="a-propos.html">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Menu burger permet d'accéder à la page A propos de Benjamin Louis, 
    d'accéder au portfolio de Benjamin Louis et de retourner à la page d'accueil. ">

    <title>MENU</title>
    <script>
        let currentLang = 'fr';

        function toggleLanguage() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            const langBtn = document.getElementById('lang-btn');

            if (langBtn) {
                langBtn.textContent = currentLang === 'fr' ? '🇬🇧 EN' : '🇫🇷 FR';
            }

            // Met à jour tous les éléments contenant data-fr et data-en
            document.querySelectorAll('[data-fr][data-en]').forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });

            // Gestion spécifique pour la valeur du bouton d'envoi du formulaire
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.value = currentLang === 'fr' ? 'ENVOYER' : 'SEND';
            }
        }
    </script>
</head>

<body>
    <main>
        <div class="wrapperMenu">
            <nav>
                <div id="menu">
                    <!-- Sélecteur de Langue -->
                    <div class="lang-switch">
                        <button id="lang-btn" onclick="toggleLanguage()">🇬🇧 EN</button>
                    </div>

                    <a href="index.html" data-fr="Accueil" data-en="Home"><strong>Accueil</strong></a>
                    <a href="a-propos.html" data-fr="À propos" data-en="About"><strong>À propos</strong></a>
                    <a href="portfolio.html" data-fr="Portfolio" data-en="Portfolio"><strong>Portfolio</strong></a>

                </div><br><br>
                <div class="offer-actions">
                    <a href="https://boutique.benjaminlouis.eu" target="_blank" class="ancre demo-btn"
                        data-fr="TESTER LA BOUTIQUE DÉMO" data-en="TEST THE DEMO STORE">TESTER LA BOUTIQUE DÉMO</a>
                    <a href="#contact" class="ancre" data-fr="COMMANDER CETTE SOLUTION"
                        data-en="ORDER THIS SOLUTION">COMMANDER
                        CETTE SOLUTION</a>
                </div>
            </nav>


        </div>

        <br><a href="mentions.html" data-fr="Mentions légales" data-en="Legal notices"><strong>Mentions
                légales</strong></a>

        <div id="info">
            <div class="pied">
                <figure>
                    <a href="index.html"><img class="size" src="images/logoBenjaminLouis.png"

</body>
